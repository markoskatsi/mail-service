<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Thanks for reaching out</title>
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<![endif]-->
<style>
  body, table, td { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; line-height: 100%; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; }
  a { text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: #201f1d !important; }
    .bg-card { background-color: #201f1d !important; border-color: #4a4642 !important; }
    .text-main { color: #f3f2f2 !important; }
    .text-muted { color: #b6b2b0 !important; }
    .divider { background-color: #4a4642 !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f3f2f2;">
  <span style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all; font-family:Georgia, 'Times New Roman', serif;">
    Thanks for reaching out. I'll get back to you as soon as I can.
  </span>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-page" style="background-color:#f3f2f2;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="bg-card" style="width:600px; max-width:600px; background-color:#f3f2f2; border:1px solid #ddd9d5;">

          <!-- kicker -->
          <tr>
            <td style="padding:40px 40px 0 40px;">
              <p class="text-muted" style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7d5411; mso-line-height-rule:exactly; line-height:16px;">
                Markos Katsi
              </p>
            </td>
          </tr>

          <!-- name / role -->
          <tr>
            <td style="padding:6px 40px 0 40px;">
              <p class="text-muted" style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:14px; color:#605d5d; mso-line-height-rule:exactly; line-height:20px;">
                Full-Stack Developer
              </p>
            </td>
          </tr>

          <!-- divider -->
          <tr>
            <td style="padding:24px 40px 0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td class="divider" height="1" style="font-size:1px; line-height:1px; background-color:#ddd9d5;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- body -->
          <tr>
            <td style="padding:28px 40px 0 40px;">
              <p class="text-main" style="margin:0 0 16px 0; font-family:Georgia, 'Times New Roman', serif; font-size:16px; color:#201f1d; mso-line-height-rule:exactly; line-height:26px;">
                Hi {{name}},
              </p>
              <p class="text-main" style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:16px; color:#201f1d; mso-line-height-rule:exactly; line-height:26px;">
                Thank you for reaching out. I've received your message and will get back to you as soon as I can.
              </p>
            </td>
          </tr>

          <!-- sign-off -->
          <tr>
            <td style="padding:28px 40px 0 40px;">
              <p class="text-main" style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:16px; color:#201f1d; mso-line-height-rule:exactly; line-height:26px;">
                Best regards,<br>
                Markos Katsi<br>
              </p>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:36px 40px 0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td class="divider" height="1" style="font-size:1px; line-height:1px; background-color:#ddd9d5;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 40px 40px;">
              <p class="text-muted" style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:12px; color:#7d7979; mso-line-height-rule:exactly; line-height:18px;">
                This is an automated reply.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
